<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IronDuck</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!--<iframe src="about.html" class="picture"></iframe>-->
    <canvas class="webgl"></canvas>
    <div class = "overlay">
        <img class ="imageLoading" src="./Gif/SpiderMoving.gif">
    </div>
    <div id="loading">
        <h1>
            <span id="progressPercentage">Loading...</span> 
        </h1>
    </div>
    <button class="start">START</button>

    <!-- Side info panel shown when a duck on the card is clicked -->
    <aside class="duck-panel" id="duckPanel">
        <button class="duck-panel__close" id="duckPanelClose" aria-label="Chiudi">&times;</button>
        <div class="duck-panel__media" id="duckPanelMedia">
            <img class="duck-panel__image" id="duckPanelImage" alt="">
        </div>
        <div class="duck-panel__body">
            <h2 class="duck-panel__name" id="duckPanelName"></h2>
            <p class="duck-panel__description" id="duckPanelDescription"></p>
            <a class="duck-panel__link" id="duckPanelLink" target="_blank" rel="noopener noreferrer">Scopri di più →</a>
        </div>
    </aside>

    <script type="module" src="./script.js"></script>
</body>
</html>

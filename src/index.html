<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IronDuck</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!--<iframe src="about.html" class="picture"></iframe>-->
    <canvas class="webgl"></canvas>
    <div class = "overlay">
        <img class ="imageLoading" src="./Gif/SpiderMoving.gif">
    </div>
    <div id="loading">
        <h1>
            <span id="progressPercentage">Loading...</span> 
        </h1>
    </div>
    <button class="start">START</button>

    <!-- Popup shown when a duck on the card is clicked -->
    <div class="duck-popup" id="duckPopup">
        <div class="duck-popup__card">
            <button class="duck-popup__close" id="duckPopupClose">&times;</button>
            <h2 class="duck-popup__title" id="duckPopupTitle"></h2>
            <p class="duck-popup__text" id="duckPopupText"></p>
        </div>
    </div>

    <script type="module" src="./script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IronDuck</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!--<iframe src="about.html" class="picture"></iframe>-->
    <canvas class="webgl"></canvas>
    <div class="overlay"></div>
    <div id="loading">
        <div class="loader__spinner"></div>
        <span id="progressPercentage" class="loader__text">Loading… 0%</span>
    </div>
    <!-- Hint shown under the card after the intro; fades out once the user starts scrolling -->
    <div class="scroll-hint" id="scrollHint">
        <span>Scroll</span>
        <span class="scroll-hint__arrow">&#8595;</span>
    </div>

    <!-- Side info panel shown when a duck on the card is clicked -->
    <aside class="duck-panel" id="duckPanel">
        <button class="duck-panel__close" id="duckPanelClose" aria-label="Chiudi">&times;</button>
        <div class="duck-panel__media" id="duckPanelMedia">
            <img class="duck-panel__image" id="duckPanelImage" alt="">
        </div>
        <div class="duck-panel__body">
            <h2 class="duck-panel__name" id="duckPanelName"></h2>
            <p class="duck-panel__description" id="duckPanelDescription"></p>
            <a class="duck-panel__link" id="duckPanelLink" target="_blank" rel="noopener noreferrer">Discover more →</a>
        </div>
    </aside>

    <script type="module" src="./script.js"></script>
</body>
</html>
